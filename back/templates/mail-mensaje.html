<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Carga con errores Inscripción</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        /* Estilos CSS */
        body {
            font-family: 'Montserrat', sans-serif;
        }

        .contenedor-imagen {
            max-width: 700px;
            width: 100%;

        }

        .contenedor-imagen img {
            max-width: 100%;
            height: auto;
        }

        .banner {
            position: relative;
            max-width: 100%;
        }
        
        .banner-image {
            width: 100%;
            height: auto;
        }
        
        .banner-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
        }
        
        .banner-content h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .banner-content p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        
        .btn {
            display: inline-block;
            padding: 10px 20px;
            text-decoration: none;
            background-color: #ff4500;
            color: #fff;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        
        .btn:hover {
            background-color: #ff6a36;
        }

        @media (max-width: 768px) {
            .banner-content {
            width: 80%;
            }
            
            .banner-content h1 {
            font-size: 2rem;
            }
            
            .banner-content p {
            font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <table style="width:1000px; margin: auto auto">        
        <tr>
            <td style="padding:5px 20px 20px 20px;">
                <h3 style="font-size: 20px;">Datos de Contacto SafeService</strong>:
                </h3>
                <p style="font-size: 18px;">
                    <ul style="padding: 2px !important;">
                        <li style="font-size: 12px;">Nombre: <strong><%= nombre %></strong></li>
                        <li style="font-size: 12px;">Email: <strong><%= email %></strong></li>
                        <li style="font-size: 12px;">Asunto: <strong><%= asunto %></strong></li>
                        <li style="font-size: 12px;">Mensaje: <strong><%= mensaje %></strong></li>
                    </ul>                   
                </p>    
            </td>
        </tr>
    </table>       
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</html>
